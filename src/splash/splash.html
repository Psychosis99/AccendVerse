<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  @font-face { font-family: 'AVLogo'; src: url(data:font/ttf;base64,/*FONT_LOGO*/) format('truetype'); }
  @font-face { font-family: 'AVGrotesk'; src: url(data:font/ttf;base64,/*FONT_GROTESK*/) format('truetype'); }
  :root { --lime: #B8FF3B; --bg: #0A0B0B; --muted: #6E7470; --surface: #1C1F1F; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 70% at 50% 40%, #171A1A 0%, var(--bg) 60%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'AVGrotesk', sans-serif; color: #ECEEEA;
  }
  #rings { position: absolute; left: 50%; bottom: -170px; transform: translateX(-50%); }
  #rings div { position: absolute; left: 50%; top: 50%; border: 1px solid rgba(255,255,255,.05); border-radius: 50%; transform: translate(-50%, -50%) scaleY(.32); opacity: 0; }
  #dial { position: relative; width: 250px; height: 250px; }
  #dial svg { position: absolute; inset: 0; overflow: visible; }
  .tick { stroke: #3A3F3C; stroke-width: 1; stroke-linecap: round; opacity: 0; }
  .tick.major { stroke: var(--muted); stroke-width: 1.6; }
  #track { fill: none; stroke: var(--surface); stroke-width: 20; }
  #face { fill: #101212; stroke: rgba(255,255,255,.07); }
  #arc { fill: none; stroke: var(--lime); stroke-width: 20; }
  #inner { fill: none; stroke: var(--lime); stroke-width: 3; stroke-linecap: round; opacity: .85; }
  #knob { opacity: 0; }
  #mark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'AVLogo', sans-serif; font-size: 64px; letter-spacing: -1px; line-height: 1;
  }
  #mark span { display: inline-block; opacity: 0; }
  #mark .v { color: var(--lime); text-shadow: 0 0 22px rgba(184,255,59,.55); }
  #name { margin-top: 34px; font-size: 13px; letter-spacing: 9px; padding-left: 9px; opacity: 0; }
  #tag { margin-top: 10px; font-size: 10px; letter-spacing: 4px; color: var(--muted); opacity: 0; }
  #bars { display: flex; gap: 10px; align-items: flex-end; height: 46px; margin-top: 34px; }
  #bars i {
    width: 16px; border-radius: 5px; transform-origin: bottom; transform: scaleY(0);
    background: repeating-linear-gradient(45deg, #2A2E2C 0 3px, #4A504C 3px 5px);
  }
  #bars i.on { background: repeating-linear-gradient(45deg, var(--lime) 0 3px, #8FCB2A 3px 5px); box-shadow: 0 0 14px rgba(184,255,59,.5); }
  #bar { position: absolute; bottom: 64px; width: 120px; height: 2px; background: #1C1F1F; border-radius: 2px; overflow: hidden; }
  #fill { width: 100%; height: 100%; background: var(--lime); transform-origin: left; transform: scaleX(0); }
</style>
</head>
<body>
  <div id="rings"><div></div><div></div><div></div><div></div></div>
  <div id="dial">
    <svg viewBox="0 0 250 250">
      <g id="ticks"></g>
      <circle id="face" cx="125" cy="125" r="84" />
      <circle id="track" cx="125" cy="125" r="94" />
      <!-- 300° lime band from 12 o'clock, clockwise -->
      <path id="arc" d="M125 31 A94 94 0 1 1 43.6 78" />
      <path id="inner" d="M125 52 A73 73 0 1 1 61.8 161.5" />
      <g id="knob">
        <circle cx="43.6" cy="78" r="19" fill="rgba(184,255,59,.28)" />
        <circle cx="43.6" cy="78" r="12.5" fill="#0A0B0B" stroke="#B8FF3B" stroke-width="2" />
        <circle cx="43.6" cy="78" r="4.5" fill="#B8FF3B" />
      </g>
    </svg>
    <div id="mark"><span>A</span><span class="v">V</span></div>
  </div>
  <div id="name">ACCENDVERSE</div>
  <div id="tag">TRACK · TRAIN · ASCEND</div>
  <div id="bars"><i style="height:40%"></i><i style="height:65%"></i><i style="height:50%"></i><i class="on" style="height:100%"></i><i style="height:70%"></i><i style="height:55%"></i></div>
  <div id="bar"><div id="fill"></div></div>

<script>/*ANIME_JS*/</script>
<script>
(function () {
  var A = window.anime;
  var NS = 'http://www.w3.org/2000/svg';
  var ticks = document.getElementById('ticks');
  for (var i = 0; i < 72; i++) {
    var a = (i / 72) * Math.PI * 2 - Math.PI / 2, major = i % 6 === 0, r1 = 110, r2 = r1 + (major ? 9 : 5);
    var l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 125 + r1 * Math.cos(a)); l.setAttribute('y1', 125 + r1 * Math.sin(a));
    l.setAttribute('x2', 125 + r2 * Math.cos(a)); l.setAttribute('y2', 125 + r2 * Math.sin(a));
    l.setAttribute('class', 'tick' + (major ? ' major' : ''));
    ticks.appendChild(l);
  }
  var rings = document.querySelectorAll('#rings div');
  for (var j = 0; j < rings.length; j++) {
    var s = 300 + j * 170;
    rings[j].style.width = s + 'px'; rings[j].style.height = s + 'px';
  }

  function done() {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage('done');
    else if (window.parent !== window) window.parent.postMessage('done', '*');
  }

  var tl = A.createTimeline({ defaults: { ease: 'outExpo' }, onComplete: done });
  tl
    .add('#rings div', { opacity: [0, 1], scale: [0.6, 1], delay: A.stagger(90), duration: 1200 }, 0)
    // Tick ring sweeps on clockwise.
    .add('.tick', { opacity: [0, 1], delay: A.stagger(9), duration: 300, ease: 'linear' }, 0)
    .add('#face', { scale: [0.85, 1], opacity: [0, 1], duration: 700, transformOrigin: '125px 125px' }, 100)
    // Lime band and inner arc draw themselves, then the handle pops at the tip.
    .add(A.svg.createDrawable('#arc'), { draw: ['0 0', '0 1'], duration: 1100, ease: 'inOutCubic' }, 250)
    .add(A.svg.createDrawable('#inner'), { draw: ['0 0', '0 1'], duration: 1000, ease: 'inOutCubic' }, 450)
    .add('#knob', { opacity: [0, 1], scale: [0, 1], duration: 500, transformOrigin: '43.6px 78px', ease: 'outBack(2)' }, 1250)
    // AV drops in.
    .add('#mark span', { opacity: [0, 1], translateY: [-28, 0], rotate: [-10, 0], delay: A.stagger(120), duration: 700 }, 550)
    .add('#name', { opacity: [0, 1], letterSpacing: ['18px', '9px'], duration: 900 }, 1000)
    .add('#tag', { opacity: [0, 1], translateY: [8, 0], duration: 700 }, 1200)
    // Mon–Sat bars rise, Thursday glows.
    .add('#bars i', { scaleY: [0, 1], delay: A.stagger(70), duration: 700 }, 1150)
    .add('#fill', { scaleX: [0, 1], duration: 1900, ease: 'inOutCubic' }, 200)
    .add('#dial', { scale: [1, 1.05, 1], duration: 500, ease: 'inOutSine' }, 1900)
    .add('body', { opacity: [1, 0], duration: 450, ease: 'inQuad' }, 2500);
})();
</script>
</body>
</html>
